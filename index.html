<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>伊丹とLINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 縦長のスマホ画面を中央に1台置く。画面の中身だけが切り替わる。 */
:root{
  --night:#0b0c10;
  --paper:#f4f5f7;
  --chat:#8aa2c8;
  --mine:#8fe35a;
  --line:#06c755;
  --ink:#1c1f24;
  --blood:#e0192b;
  --font-ui:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --font-horror:"DotGothic16","Noto Sans JP",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;
  background:var(--night);color:#fff;font-family:var(--font-ui);
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:center;align-items:center;
}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #ffd84d;outline-offset:2px}
#phone{
  --heat:0;
  position:relative;width:min(100%,420px);height:min(100%,820px);
  background:var(--paper);color:var(--ink);overflow:hidden;
  border-radius:26px;display:flex;flex-direction:column;
  box-shadow:0 0 0 2px #2a2d36,0 20px 60px rgba(0,0,0,.6);
}
#phone::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:40;
  background:radial-gradient(ellipse at center,transparent 35%,rgba(200,0,20,calc(var(--heat)*.55)) 100%);
}
#phone.hot::after{animation:throb 1s ease-in-out infinite}
@keyframes throb{50%{opacity:.45}}
#status{
  height:26px;flex:none;display:flex;justify-content:space-between;align-items:center;
  padding:0 18px;font-size:12px;font-weight:700;background:var(--paper);color:var(--ink);z-index:5;
  font-variant-numeric:tabular-nums;
}
#phone[data-tone=dark] #status{background:#000;color:#fff}
#screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
#homebar{
  flex:none;height:26px;background:transparent;border:0;display:flex;justify-content:center;align-items:center;
  background:var(--paper);z-index:5;
}
#phone[data-tone=dark] #homebar{background:#000}
#homebar i{display:block;width:120px;height:5px;border-radius:3px;background:#222}
#phone[data-tone=dark] #homebar i{background:#bbb}

.scr{flex:1;min-height:0;display:flex;flex-direction:column}
.dark{background:#000;color:#eee}

/* title */
.title{justify-content:center;align-items:center;gap:18px;padding:24px;text-align:center;background:#0b0c10;color:#fff}
.title h1{font-family:var(--font-horror);font-size:44px;margin:0;line-height:1.15;text-wrap:balance}
.title h1 em{font-style:normal;color:var(--line)}
.title p{margin:0;font-size:14px;line-height:1.8;color:#b9bdc7;max-width:28em}
.btn{background:var(--line);color:#fff;border:0;border-radius:10px;padding:14px 28px;font-size:16px;font-weight:700}
.btn.red{background:var(--blood)}
.btn.ghost{background:transparent;border:2px solid #fff}

/* header */
.hd{flex:none;background:#fff;border-bottom:1px solid #dcdfe4;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.hd .top{display:flex;align-items:center;gap:10px}
.back{border:0;background:none;font-size:24px;line-height:1;padding:2px 8px;color:var(--ink)}
.back.pulse{animation:nudge 1s ease-in-out infinite;color:var(--line);font-weight:700}
@keyframes nudge{50%{transform:translateX(-5px)}}
.hd h2{margin:0;font-size:17px;flex:1}
.chip{font-size:12px;font-weight:700;background:#eef0f3;border-radius:99px;padding:3px 10px;font-variant-numeric:tabular-nums}
.gauge{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700}
.gauge .bar{position:relative;flex:1;height:12px;border-radius:6px;background:#e3e6ea;overflow:hidden}
.gauge .fill{position:absolute;inset:0 auto 0 0;width:30%;background:linear-gradient(90deg,#f7a1b5,#e0192b);transition:width .6s}
.gauge .mark{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#1c1f24}
.gauge b{font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}

/* chat */
.msgs{flex:1;min-height:0;overflow-y:auto;background:var(--chat);padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:flex-end;gap:6px;max-width:88%}
.row.me{align-self:flex-end;flex-direction:row-reverse}
.row .av{flex:none;width:34px;height:34px;border-radius:50%;background:#3b3f4a;color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700;align-self:flex-start}
.row .b{padding:9px 13px;border-radius:16px;background:#fff;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.row.me .b{background:var(--mine)}
.row .meta{font-size:10px;color:#1c1f24;opacity:.7;margin-bottom:2px}
.row .b.red{background:#12060a;color:#ff2c3e;font-family:var(--font-horror);font-size:16px;border:1px solid #7a0b16;animation:glitch .18s steps(2) 6}
@keyframes glitch{50%{transform:translateX(2px);filter:hue-rotate(40deg)}}
.typing .b{display:flex;gap:4px;padding:12px 14px}
.typing .b span{width:7px;height:7px;border-radius:50%;background:#999;animation:dot 1s infinite}
.typing .b span:nth-child(2){animation-delay:.15s}.typing .b span:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-4px);opacity:.4}}
.tray{flex:none;background:#fff;border-top:1px solid #dcdfe4;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:64px;justify-content:center}
.tray .hint{font-size:12px;color:#6b7280;text-align:center;margin:0}
.choice{background:#fff;border:2px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14.5px;text-align:left;line-height:1.4}
.choice:hover{background:#eafaf0}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0;border:1px solid #cfd3da;border-radius:20px;padding:10px 14px;font-size:15px;font-family:inherit}
.inrow button{border:0;background:var(--line);color:#fff;border-radius:20px;padding:0 16px;font-weight:700}
.sugg{align-self:flex-start;background:#eef0f3;border:1px solid #cfd3da;border-radius:99px;padding:6px 14px;font-size:13px}

/* talk list */
.list{flex:1;overflow-y:auto;background:#fff}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border:0;border-bottom:1px solid #eef0f3;background:#fff;text-align:left;font-size:15px}
.li:hover{background:#f4f9f6}
.li .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.li .t{flex:1;min-width:0}
.li .t b{display:block}
.li .t small{color:#6b7280;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--blood);color:#fff;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:700}

/* home */
.home{background:linear-gradient(160deg,#1a2540,#3b1f3f 60%,#12060a);color:#fff;padding:36px 22px;display:grid;grid-template-columns:repeat(4,1fr);align-content:start;gap:26px 10px;justify-items:center}
.app{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px}
.app span.ic{width:58px;height:58px;border-radius:15px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff}

/* map */
.mapwrap{flex:none;background:#dfe8d6;border-bottom:1px solid #c4cdbb}
.mapwrap svg{display:block;width:100%;height:auto}
.spots{flex:1;overflow-y:auto;background:#fff}
.sp{display:flex;align-items:center;gap:10px;width:100%;padding:11px 16px;border:0;border-bottom:1px solid #eef0f3;background:#fff;font-size:15px;text-align:left}
.sp.on{background:#e7f1ff;font-weight:700}
.sp i{width:12px;height:12px;border-radius:50%;background:#4a86e8;flex:none}
.sp.on i{background:var(--blood)}
.go{flex:none;padding:10px 16px;background:#fff;border-top:1px solid #dcdfe4}
.go .btn{width:100%;background:#4a86e8}
.go .btn:disabled{background:#b7bec9}

/* story / end */
.story{padding:28px 22px;justify-content:center;gap:16px;font-family:var(--font-horror);font-size:18px;line-height:1.8}
.story p{margin:0;animation:fadein .8s both}
.story p.r{color:#ff2c3e}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.hide{padding:22px;gap:14px;justify-content:center}
.hide h2{font-family:var(--font-horror);font-size:26px;margin:0;color:#ff2c3e;line-height:1.4}
.hide p{margin:0;font-family:var(--font-horror);font-size:15px;line-height:1.7;color:#ccc}
.timer{height:8px;border-radius:4px;background:#2a0b10;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--blood);transform-origin:left;animation:tick 10s linear forwards}
@keyframes tick{to{transform:scaleX(0)}}
.hide .choice{background:#14161c;color:#fff;border-color:#5a1018;font-family:var(--font-horror);font-size:16px}
.hide .choice:hover{background:#2a0b10}
.end{position:absolute;inset:0;z-index:30;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center;animation:fadein 1s both}
.end h2{font-family:var(--font-horror);font-size:46px;margin:0;color:var(--blood)}
.end.clear h2{color:#ffe27a}
.end.true h2{color:#ffe27a}
.end p{margin:0;line-height:1.8;color:#cfd2da;font-size:15px}
.end p.r{color:#ff2c3e;font-family:var(--font-horror);font-size:18px}
.notice{position:absolute;left:10px;right:10px;top:34px;z-index:45;background:rgba(20,20,24,.95);color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;animation:drop .4s both}
.notice.red{color:#ff2c3e;font-family:var(--font-horror);border:1px solid #7a0b16}
.notice small{display:block;color:#9aa;font-size:11px;font-family:var(--font-ui)}
@keyframes drop{from{transform:translateY(-80px);opacity:0}}
.toast{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;font-size:13px;padding:8px 14px;border-radius:99px;z-index:50;max-width:90%;text-align:center}
.shake{animation:shake .4s 2}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:480px){#phone{border-radius:0;height:100%}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>

</head>
<body>
<div id="phone" data-tone="dark">
  <div id="status"><span id="clock">1:54</span><span>LTE 87%</span></div>
  <div id="screen"></div>
  <button id="homebar" aria-label="ホーム画面へ"><i></i></button>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const RED='えりさんや そんなに愛を欲しいのかい 分かりましたよ 今言います';

const ROUNDS=[
 {q:'えり、起きてる？',c:[['ん ありがとう',-6],['ガールフレンドに変わってくれますか？',18],['困惑です。',-3]]},
 {q:'お昼どうする？',c:[['がぐしょく',-6],['吉野家かマック！（大嘘）',-2],['まゆかも送ってよ〜',11]]},
 {q:'ねえ、自撮り送ってよ',c:[['僕一応男の子だからね？！',-6],['自撮り',15],['ロック画面画面',8]]},
 {q:'最近、僕以外ともよく話してるよね',c:[['プーさん（DM隠蔽）',9],['ちょっとむりかも、あいて重い（ビンビン）',13],['人間不信なりそう',-4]]},
 {q:'健介の車、見た？',c:[['健介プリウスなんよなー',-6],['ちょっと嫉妬した笑',11],['なにかに狙われてる？笑',-2]]},
 {q:'ねえ、告白してもいい？',c:[['告白？？',8],['んーとね',-3],['好きだよ！',22]]},
 {q:'他の男と遊びに行くの？',c:[['行かんといてよー',14],['許せんわ',7],['体ひとつしかないから',-7]]},
 {q:'今夜、えりの家に泊まりたい',c:[['行く！まゆの家にお泊まり行く！',26],['だめ笑',-8],['嘘でしょ？？？',-3]]},
 {q:'もう別れよっか',c:[['別れよっかって簡単に言わないで！',8],['親友だって大切だよ！',-5],['もう傷つけたくないの わかる？',4]]},
 {q:'じゃあ、いちばん大切なの誰？',c:[['まゆ',10],['傲慢だから両方とる笑',16],['好意を持たれるとすぐ好きになる、自分のキモイところです。',-6]]}
];
const EXTRA=[
 {q:'アカウント、返してくれる？',c:[['あいしてんよ だからな アカウント返せ',12],['ならば アカウントを元に戻してくれますか？',-4],['だまれ 返せアカウント',6]]},
 {q:'えりのこと、どう思ってる？',c:[['こんな俺でもですか？',-2],['ん ありがとう',-5],['ガールフレンドに変わってくれますか？',18]]}
];
const FRIENDS=['かける','やまの','けんすけ','はるま','こうへい','やまもと','うー','たけのこ','しらすさん','れいさん'];
const SPOTS=[
 ['善キューブ',60,95],['善通寺市役所',92,70],['善通寺ハローズ',120,118],['北海道',330,28],
 ['宇多津イオン',285,120],['香川短期大学',215,56],['さくらガーデン',165,30],['綾川イオン',235,100]
];
const HIDE=[
 ['フードコート','フードコートの席に身をかがめた。「えり、みーつけた」肩に冷たい手が置かれた。'],
 ['ゲームセンター','UFOキャッチャーの筐体に、背後に立つ伊丹の顔が映った。'],
 ['イオンシネマ','暗いスクリーンの前。入口から差し込む光の中に、伊丹の影が伸びてくる。'],
 ['映画の反対側のトイレ',null],
 ['駐車場','車の陰に隠れた。ヘッドライトが点き、えりを真正面から照らした。']
];

const S={};
function reset(){
  Object.assign(S,{screen:'title',gauge:30,rally:0,round:0,busy:false,locked:false,phase:'rally',
    itami:[],haru:[],choices:null,sel:null,seq:0});
  $('#phone').style.setProperty('--heat',0);$('#phone').classList.remove('hot');
}
reset();

function setTone(t){$('#phone').dataset.tone=t}
function clock(){const d=new Date();$('#clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}
clock();setInterval(clock,30000);

function toast(t){
  const old=$('.toast');if(old)old.remove();
  const d=document.createElement('div');d.className='toast';d.textContent=t;$('#phone').appendChild(d);
  setTimeout(()=>d.remove(),1800);
}
function notify(t,red){
  const d=document.createElement('div');d.className='notice'+(red?' red':'');
  d.innerHTML='<div><small>LINE ・ 伊丹</small><span></span></div>';d.querySelector('span').textContent=t;
  $('#phone').appendChild(d);setTimeout(()=>d.remove(),5200);
}
function go(s){S.screen=s;draw()}

/* ---------- gauge ---------- */
function setHeat(){
  const p=$('#phone');p.style.setProperty('--heat',Math.max(0,(S.gauge-40)/60));
  p.classList.toggle('hot',S.gauge>=75);
}
function updateGauge(){
  const f=$('.fill'),n=$('#gnum');
  if(f)f.style.width=S.gauge+'%';
  if(n)n.textContent=S.gauge+'%';
  setHeat();
}

/* ---------- chat ---------- */
function msgEl(m){
  const d=document.createElement('div');d.className='row '+(m.me?'me':'them');
  d.innerHTML=(m.me?'<span class="meta">既読</span>':'<span class="av"></span>')+'<div class="b'+(m.red?' red':'')+'"></div>';
  if(!m.me)d.querySelector('.av').textContent=m.av;
  d.querySelector('.b').textContent=m.text;return d;
}
function logOf(k){return k==='itami'?S.itami:S.haru}
function say(k,m){
  logOf(k).push(m);
  const box=$('#msgs');
  if(box&&S.screen===(k==='itami'?'chat':'haru')){box.appendChild(msgEl(m));box.scrollTop=box.scrollHeight}
}
function typing(on){
  const box=$('#msgs');if(!box)return;
  let t=$('#typing');
  if(on&&!t){t=document.createElement('div');t.id='typing';t.className='row them typing';
    t.innerHTML='<span class="av">…</span><div class="b"><span></span><span></span><span></span></div>';box.appendChild(t);box.scrollTop=box.scrollHeight}
  if(!on&&t)t.remove();
}
async function itamiSay(text,red){
  typing(true);await sleep(red?1100:800);typing(false);
  say('itami',{me:false,av:'伊',text,red});await sleep(250);
}
function dChat(){
  setTone('light');
  const sc=$('#screen');
  sc.innerHTML=`<div class="scr">
    <div class="hd"><div class="top"><button class="back${S.phase!=='rally'?' pulse':''}" id="bk" aria-label="トーク一覧へ戻る">＜</button><h2>伊丹</h2><span class="chip" id="rc">RALLY ${Math.min(S.rally,10)}/10</span></div>
    <div class="gauge"><span>えろえり度</span><div class="bar"><div class="fill" style="width:${S.gauge}%"></div><div class="mark" title="50"></div></div><b id="gnum">${S.gauge}%</b></div></div>
    <div class="msgs" id="msgs"></div><div class="tray" id="tray"></div></div>`;
  const box=$('#msgs');S.itami.forEach(m=>box.appendChild(msgEl(m)));box.scrollTop=box.scrollHeight;
  $('#bk').onclick=()=>{ if(S.phase==='rally'||S.locked){toast('いま戻ったら、伊丹に追いつかれる…')} else go('list') };
  renderTray();
}
function renderTray(){
  const tr=$('#tray');if(!tr)return;
  tr.innerHTML='';
  if(S.choices){
    S.choices.forEach((c,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=c[0];b.onclick=()=>pick(i);tr.appendChild(b)});
  }else{
    const p=document.createElement('p');p.className='hint';
    p.textContent=S.phase==='rally'?'伊丹が入力中…':(S.phase==='cleared'?'伊丹からの通知が止まらない。左上の＜で戻れる。':'');
    tr.appendChild(p);
  }
}
async function nextRound(){
  const pool=S.round<ROUNDS.length?ROUNDS[S.round]:EXTRA[(S.round-ROUNDS.length)%EXTRA.length];
  S.round++;
  await itamiSay(pool.q);
  S.choices=shuffle(pool.c);renderTray();S.busy=false;
}
async function pick(i){
  if(S.busy||!S.choices)return;S.busy=true;
  const [t,d]=S.choices[i];S.choices=null;renderTray();
  say('itami',{me:true,text:t});
  S.gauge=Math.max(0,Math.min(100,S.gauge+d));S.rally++;
  const rc=$('#rc');if(rc)rc.textContent='RALLY '+Math.min(S.rally,10)+'/10';
  updateGauge();await sleep(700);
  if(S.gauge>=100){return heatOver()}
  if(S.rally>=10){
    if(S.gauge<=50){
      await itamiSay('えり、すき');
      S.phase='cleared';S.busy=false;dChatKeep();return;
    }
    await itamiSay('…まだ足りないな。もう少し話そうよ');
  }
  await nextRound();
}
function dChatKeep(){const b=$('#bk');if(b)b.classList.add('pulse');renderTray()}
async function heatOver(){
  S.locked=true;
  await itamiSay(RED,true);await sleep(1400);
  showEnd('bad','BAD END','えろえり度が最高に達した。',RED);
}
async function startGame(){
  reset();S.screen='chat';draw();
  await sleep(500);
  await nextRound();
}

/* ---------- talk list ---------- */
function dList(){
  setTone('light');
  const cols=['#e08a3c','#4a86e8','#8a5ad6','#d6568a','#3caa8a','#b0813a','#6b7280','#c4623c','#3a7ab0','#7a9a3c'];
  const sc=$('#screen');
  sc.innerHTML=`<div class="scr"><div class="hd"><div class="top"><h2 style="margin-left:8px">トーク</h2></div></div><div class="list" id="ll"></div></div>`;
  const ll=$('#ll');
  const add=(name,sub,col,badge)=>{
    const b=document.createElement('button');b.className='li';
    b.innerHTML='<span class="av" style="background:'+col+'"></span><span class="t"><b></b><small></small></span>'+(badge?'<span class="badge">'+badge+'</span>':'');
    b.querySelector('.av').textContent=name[0];b.querySelector('b').textContent=name;b.querySelector('small').textContent=sub;
    b.onclick=()=>openFriend(name);ll.appendChild(b);
  };
  add('伊丹','えり、すき','#3b3f4a',S.phase==='cleared'?'99+':'');
  const lastMsgs={'はるま':'いつでも連絡してな'};
  FRIENDS.forEach((n,i)=>add(n,lastMsgs[n]||'スタンプを送信しました',cols[i],''));
}
function openFriend(n){
  if(n==='伊丹'){S.screen='chat';draw();return}
  if(n==='はるま'){S.screen='haru';draw();return}
  toast(n+'は既読がつかない…');
}

/* ---------- haru chat ---------- */
function dHaru(){
  setTone('light');
  const sc=$('#screen');
  sc.innerHTML=`<div class="scr"><div class="hd"><div class="top"><button class="back" id="bk" aria-label="戻る">＜</button><h2>はるま</h2></div></div>
  <div class="msgs" id="msgs"></div>
  <div class="tray"><button class="sugg" id="sg">助けて！</button><div class="inrow"><input id="hin" type="text" placeholder="メッセージを入力" autocomplete="off"><button id="hs">送信</button></div></div></div>`;
  const box=$('#msgs');S.haru.forEach(m=>box.appendChild(msgEl(m)));box.scrollTop=box.scrollHeight;
  $('#bk').onclick=()=>go('list');
  $('#sg').onclick=()=>{$('#hin').value='助けて！';$('#hin').focus()};
  $('#hs').onclick=sendHaru;
  $('#hin').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)sendHaru()};
}
async function sendHaru(){
  const inp=$('#hin');if(!inp||S.busy)return;
  const v=inp.value.trim();if(!v)return;
  S.busy=true;inp.value='';
  say('haru',{me:true,text:v});
  typing(true);await sleep(900);typing(false);
  if(S.phase==='cleared'&&v.includes('助けて')){
    say('haru',{me:false,av:'は',text:'えろえり！！！'});
    S.phase='map';
    await sleep(300);toast('ホーム画面に戻ろう');
  }else if(S.phase==='cleared'){
    say('haru',{me:false,av:'は',text:'ん？どしたん'});
  }else{
    say('haru',{me:false,av:'は',text:'おん'});
  }
  S.busy=false;
}

/* ---------- home ---------- */
function dHome(){
  setTone('dark');
  const apps=[['LINE','#06c755',()=>{ if(S.phase==='rally'){S.screen='chat';draw()}else go('list') }],
    ['マップ','#4a86e8',()=>{ if(S.phase==='map')go('map'); else toast('いまは開けない') }],
    ['カメラ','#555',null],['電話','#2a9d4a',null],['時計','#d6568a',null],['設定','#777',null],['メモ','#d6a73a',null],['写真','#8a5ad6',null]];
  const sc=$('#screen');sc.innerHTML='<div class="scr home" id="hm"></div>';
  apps.forEach(([n,c,f])=>{
    const b=document.createElement('button');b.className='app';
    b.innerHTML='<span class="ic" style="background:'+c+'"></span><span></span>';
    b.querySelector('.ic').textContent=n==='LINE'?'LINE':n[0];b.lastChild.textContent=n;
    b.onclick=f||(()=>toast('いまは使えない'));$('#hm').appendChild(b);
  });
}

/* ---------- map ---------- */
function dMap(){
  setTone('light');
  if(!S.mapOrder)S.mapOrder=shuffle(SPOTS);
  const pins=SPOTS.map(s=>`<circle class="pin" data-n="${s[0]}" cx="${s[1]}" cy="${s[2]}" r="5" fill="#4a86e8" stroke="#fff" stroke-width="2"/>`).join('');
  const sc=$('#screen');
  sc.innerHTML=`<div class="scr"><div class="hd"><div class="top"><button class="back" id="bk" aria-label="ホームへ">＜</button><h2>マップ</h2></div></div>
  <div class="mapwrap"><svg id="mp" viewBox="0 0 360 150" role="img" aria-label="香川の地図">
   <rect width="360" height="150" fill="#dfe8d6"/>
   <path d="M0 110 C80 90 140 130 220 100 S330 80 360 90" stroke="#fff" stroke-width="7" fill="none"/>
   <path d="M70 0 C80 50 130 70 150 150" stroke="#fff" stroke-width="5" fill="none"/>
   <path d="M200 0 C210 40 250 60 260 150" stroke="#fff" stroke-width="5" fill="none"/>
   <path d="M0 40 H360" stroke="#f1d98a" stroke-width="3" fill="none"/>
   <circle cx="20" cy="135" r="6" fill="#e0192b" stroke="#fff" stroke-width="2"/><text x="30" y="139" font-size="10" fill="#333">現在地</text>
   ${pins}<path id="rt" d="" fill="none" stroke="#e0192b" stroke-width="4" stroke-linecap="round"/></svg></div>
  <div class="spots" id="sps"></div>
  <div class="go"><button class="btn" id="gob" disabled>目的地を選んでください</button></div></div>`;
  $('#bk').onclick=()=>go('home');
  const box=$('#sps');
  S.mapOrder.forEach(s=>{
    const b=document.createElement('button');b.className='sp'+(S.sel===s[0]?' on':'');
    b.innerHTML='<i></i><span></span>';b.querySelector('span').textContent=s[0];
    b.onclick=()=>{S.sel=s[0];box.querySelectorAll('.sp').forEach(x=>x.classList.remove('on'));b.classList.add('on');
      const g=$('#gob');g.disabled=false;g.textContent='「'+s[0]+'」までの経路を設定';
      document.querySelectorAll('.pin').forEach(p=>p.setAttribute('fill',p.dataset.n===s[0]?'#e0192b':'#4a86e8'))};
    box.appendChild(b);
  });
  $('#gob').onclick=route;
}
async function route(){
  if(!S.sel||S.locked)return;S.locked=true;
  const s=SPOTS.find(x=>x[0]===S.sel),rt=$('#rt');
  const g=$('#gob');g.textContent='経路を設定しました。ナビ開始…';g.disabled=true;
  rt.setAttribute('d','M20 135 C60 '+(s[2]+30)+' '+(s[1]-40)+' '+s[2]+' '+s[1]+' '+s[2]);
  const L=rt.getTotalLength();rt.style.strokeDasharray=L;rt.style.strokeDashoffset=L;
  rt.getBoundingClientRect();rt.style.transition='stroke-dashoffset 2.4s linear';rt.style.strokeDashoffset=0;
  await sleep(2900);
  if(S.sel==='綾川イオン')arrive();else fakeTrue();
}
async function fakeTrue(){
  showEnd('true','TRUE END','えりは無事に「'+S.sel+'」へたどり着いた。\nもう、追われることはない。');
  await sleep(3800);
  const e=$('.end');if(e){e.classList.add('shake')}
  notify(RED,true);
  await sleep(2600);
  showEnd('bad','BAD END','最後の最後で、追いつかれた。',RED);
}

/* ---------- aeon ---------- */
async function arrive(){
  S.screen='story';setTone('dark');
  const sc=$('#screen');sc.innerHTML='<div class="scr dark story" id="st"></div>';
  const line=async(t,cls,w)=>{const p=document.createElement('p');if(cls)p.className=cls;p.textContent=t;$('#st').appendChild(p);await sleep(w||1300)};
  await line('綾川イオンに着いた。');
  await line('平日の夜。客はまばらで、BGMだけが響いている。');
  notify('えり、どこ？ もうすぐ着くよ',true);
  await line('スマホが震えた。伊丹だ。','r',1500);
  await line('近い。足音が、エスカレーターの下から聞こえる。','r',1500);
  hideScene();
}
function hideScene(){
  S.screen='hide';S.locked=true;setTone('dark');
  const sc=$('#screen');
  sc.innerHTML=`<div class="scr dark hide"><h2>どこに隠れようか？</h2><p>残り10秒。迷っている時間はない。</p><div class="timer"><i></i></div><div id="hc" style="display:flex;flex-direction:column;gap:10px"></div></div>`;
  let done=false;
  const hc=$('#hc');
  shuffle(HIDE).forEach(h=>{
    const b=document.createElement('button');b.className='choice';b.textContent=h[0];
    b.onclick=()=>{if(done)return;done=true;clearTimeout(tm);resolveHide(h)};hc.appendChild(b);
  });
  const tm=setTimeout(()=>{if(done)return;done=true;
    showEnd('bad','BAD END','迷っている間に、足音はすぐ後ろまで来ていた。','えり、みつけた');},10000);
}
async function resolveHide(h){
  if(h[1]){showEnd('bad','BAD END',h[1],'えり、みつけた');return}
  S.screen='story';
  const sc=$('#screen');sc.innerHTML='<div class="scr dark story" id="st"></div>';
  const line=async(t,cls,w)=>{const p=document.createElement('p');if(cls)p.className=cls;p.textContent=t;$('#st').appendChild(p);await sleep(w||1500)};
  await line('映画館の反対側。突き当たりのトイレに駆け込んだ。');
  await line('個室の鍵を閉めて、スマホの通知を切る。息を止める。');
  await line('コツ、コツ、コツ…','r',1600);
  await line('「えり〜？ どこ〜？」声は映画館のほうへ遠ざかっていった。','r',2000);
  await line('足音が消えるまで、えりは動かなかった。',null,2000);
  showEnd('clear','SURVIVED','えりは生き延びた。\n長い夜が、ようやく明けていく。');
}

/* ---------- end ---------- */
function showEnd(kind,title,body,red){
  S.locked=true;setTone('dark');
  const old=$('.end');if(old)old.remove();
  const d=document.createElement('div');d.className='end '+kind;
  d.innerHTML='<h2></h2><p class="b"></p>'+(red?'<p class="r"></p>':'')+'<button class="btn '+(kind==='bad'?'red':'')+'" id="rt2"></button>';
  d.querySelector('h2').textContent=title;
  d.querySelector('.b').style.whiteSpace='pre-line';d.querySelector('.b').textContent=body;
  if(red)d.querySelector('.r').textContent=red;
  const btn=d.querySelector('#rt2');
  if(kind==='true'){btn.remove()}
  else{btn.textContent=kind==='bad'?'もう一度やる':'もう一度あそぶ';btn.onclick=()=>{d.remove();reset();draw()}}
  $('#phone').appendChild(d);
}

/* ---------- title ---------- */
function dTitle(){
  setTone('dark');
  $('#screen').innerHTML=`<div class="scr title"><h1>伊丹と<em>LINE</em></h1>
  <p>伊丹から届くメッセージに、えりとして返信していこう。<br>えろえり度が最高になったらゲームオーバー。<br>50%以下をキープしたまま、10ラリーを終えられるか。</p>
  <button class="btn" id="sg2">はじめる</button></div>`;
  $('#sg2').onclick=startGame;
}

function draw(){
  const m={title:dTitle,chat:dChat,list:dList,haru:dHaru,home:dHome,map:dMap};
  if(m[S.screen])m[S.screen]();
}
$('#homebar').onclick=()=>{
  if(S.locked||S.screen==='title'||S.screen==='story'||S.screen==='hide')return;
  if(S.screen==='home')return;
  go('home');
};
window.__S=S;window.__go=go;
draw();
})();
</script>
</body>
</html>
